name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t text2sql-studio:ci .
      - name: Smoke test
        run: |
          docker run -d --name t2s -p 8000:8000 -e OPENROUTER_KEY=dummy text2sql-studio:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && exit 0; sleep 2; done
          docker logs t2s; exit 1
